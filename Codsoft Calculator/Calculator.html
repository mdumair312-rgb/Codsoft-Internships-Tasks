<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212; /* Dark background */
        }

        .calculator {
            background-color: #222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 320px;
        }

        #display {
            width: 100%;
            height: 60px;
            background-color: #333;
            color: #fff;
            font-size: 32px;
            text-align: right;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* CSS Grid System for button alignment */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background-color: #444;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #555;
        }

        .operator {
            background-color: #00e5ff;
            color: #000;
            font-weight: bold;
        }

        .operator:hover {
            background-color: #00b3cc;
        }

        .clear {
            background-color: #ff4757;
        }

        .clear:hover {
            background-color: #ff6b81;
        }

        /* Make the Equal sign taller and the Zero button wider */
        .equal {
            grid-row: span 3;
            background-color: #00e5ff;
            color: #000;
            font-weight: bold;
        }

        .equal:hover {
            background-color: #00b3cc;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled>

        <div class="buttons">
            <button class="btn clear">C</button>
            <button class="btn operator">/</button>
            <button class="btn operator">*</button>
            <button class="btn operator">-</button>

            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn operator">+</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn equal">=</button>

            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>

            <button class="btn zero">0</button>
            <button class="btn">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('.btn');

        // Using a loop to attach event listeners to all buttons
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener('click', function() {
                let value = this.innerText;

                // If-else statements to handle user input
                if (value === 'C') {
                    display.value = ''; // Clears the screen
                }
                else if (value === '=') {
                    try {
                        // Evaluates the math expression
                        display.value = eval(display.value);
                    } catch (error) {
                        display.value = 'Error'; // Handles bad math inputs like '++'
                    }
                }
                else {
                    // Appends numbers and operators to the screen
                    display.value += value;
                }
            });
        }
    </script>
</body>
</html>
